name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # node 24 ships npm 11.x; OIDC publish needs npm 11.5+.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # An npm version number can never be reused, so publishing one that does
      # not match the release is unrecoverable. tag_name goes through env
      # rather than being interpolated into the script, since it is arbitrary
      # text. workflow_dispatch has no release, hence the `if`.
      - name: Guard package version matches the release tag
        if: github.event_name == 'release'
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          TAG_VERSION="${TAG_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "package.json is $PKG_VERSION but the release tag is $TAG_VERSION — fix one before releasing" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Report dependency audit
        run: npm audit --audit-level=high || true

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Build
        run: npm run build

      - name: Verify checked-in dist is up to date
        run: |
          if [ -n "$(git ls-files 'dist/*' 'dist/**')" ]; then
            git diff --exit-code -- dist
          fi

      - name: Validate tracked package files
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys
          root = pathlib.Path('.')
          tracked = subprocess.check_output(['git', 'ls-files', '-z'], text=True).split('\0')
          errors = []
          for rel in filter(None, tracked):
              if rel.endswith('.gitkeep'):
                  continue
              path = root / rel
              if rel.endswith(('.new', '.tmp', '.bak', '.orig')):
                  errors.append(f"tracked temp file: {rel}")
              if path.is_file() and path.stat().st_size == 0:
                  errors.append(f"empty tracked file: {rel}")
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          PY

      # Publishes via trusted publishing (OIDC) — no token, no OTP, and
      # provenance is attached automatically because this repo is public.
      # One-time setup: npmjs.com -> @reevit/core -> Settings -> Trusted
      # Publisher -> GitHub Actions -> Reevit-Platform/core-sdk, workflow
      # publish.yml. Do not reintroduce NODE_AUTH_TOKEN: setup-node writes
      # whatever it is given into .npmrc, and any credential there suppresses
      # OIDC entirely — including an expired one, which is how 0.9.1 failed.
      - name: Publish to npm
        run: |
          npm install -g npm@latest
          npm publish --access public
